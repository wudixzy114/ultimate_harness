[workspace]
resolver = "2"
members = [
    "crates/uh-core",
    "crates/uh-skill-plan-first",
    "crates/uh",
    "tools/uh-devtool",
    "tools/uh-devtool-analyze",
]
exclude = [
    "grok-build",
    "deepseek-harness",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
authors = ["Ultimate Harness Contributors"]
description = "An agent harness with structured iteration as first-class concern"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
futures = "0.3"

# dev-only (uh-devtool, uh-devtool-analyze)
clap = { version = "4", features = ["derive"] }
walkdir = "2"
notify = "6"
tiny_http = "0.12"
syn = { version = "2", features = ["full", "extra-traits", "parsing"] }
proc-macro2 = "1"
quote = "1"

# Profile
[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
strip = true
