[workspace]
resolver = "2"
members = [
    "crates/uh-core",
    "crates/uh-skill-plan-first",
    "crates/uh",
    "tools/uh-devtool-analyze",
    "tools/uh-devtool",
]

# Boundary rule:
#   tools/* MUST NOT depend on crates/*.
#   uh-devtool-analyze reads .rs source via filesystem only,
#   it never imports uh-core. This keeps the code viewer
#   physically independent and trivially extractable to a
#   separate repo / crate if needed.

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
authors = ["zongyu xie"]
description = "Ultimate agent harness"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
futures = "0.3"

# Dev toolchain (tools/*)
syn = { version = "2", features = ["full", "extra-traits", "parsing"] }
quote = "1"
walkdir = "2"
notify = "6"
clap = { version = "4", features = ["derive"] }
tiny_http = "0.12"

# Profile
[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
strip = true
