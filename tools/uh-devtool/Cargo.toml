[package]
name = "uh-devtool"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "CLI / HTTP server for the Ultimate Harness code viewer (read-only, no uh-core dep)"

[[bin]]
name = "uh-devtool"
path = "src/main.rs"

[dependencies]
uh-devtool-analyze = { path = "../uh-devtool-analyze" }
